name: CI

on:
  push:
  pull_request:

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: MCP initialize + tools/list
        env:
          DAYTONA_DISABLE: "1"
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | node mcp-server/index.js > /tmp/mcp-out.ndjson
          grep -q '"name":"CodeSentinel"' /tmp/mcp-out.ndjson
          # serverInfo.version must track package.json — it drifted to 1.0.0
          # once already, and Glama surfaces whatever the server reports.
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          grep -q "\"version\":\"${PKG_VERSION}\"" /tmp/mcp-out.ndjson
          grep -q 'analyze_dead_code' /tmp/mcp-out.ndjson
          grep -q 'full_health_scan' /tmp/mcp-out.ndjson
          test "$(grep -c '"jsonrpc"' /tmp/mcp-out.ndjson)" -ge 2
